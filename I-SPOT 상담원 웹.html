<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>I-SPOT 상담원 웹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 왼쪽 고정 메뉴 + 오른쪽 작업 영역. 좁은 화면에서는 메뉴가 위쪽 가로 띠로 바뀜.
   색은 I-SPOT 설계 지도와 같은 청록 계열. 상태색(긴급/확인 필요/아이 안건/일반)은 별도 의미색 */
:root{
  --bg:#f6f8f8; --surface:#ffffff; --band:#eef2f3; --line:#d7dfe1; --ink:#17252a; --sub:#56666c; --mute:#7d8b90;
  --brand:#1d5c63; --brand-2:#2c7a82; --brand-bg:#e3f0f0; --on-brand:#ffffff;
  --red:#b23a32; --red-bg:#fbeceb; --amb:#8a6410; --amb-bg:#f8f0dc; --kid:#b4561f; --kid-bg:#fbefe6; --grn:#2f7a52; --grn-bg:#e7f3ec;
  --hl:#fff3c4;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#152023; --band:#1b282c; --line:#2b3b40; --ink:#e3ecee; --sub:#9db0b5; --mute:#7f9297;
    --brand:#7cc4c6; --brand-2:#93d2d3; --brand-bg:#173033; --on-brand:#0f1719;
    --red:#ef8f86; --red-bg:#3a2220; --amb:#e5c06a; --amb-bg:#342b17; --kid:#f0a26e; --kid-bg:#352419; --grn:#80cfa2; --grn-bg:#18301f;
    --hl:#4a3f14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#152023; --band:#1b282c; --line:#2b3b40; --ink:#e3ecee; --sub:#9db0b5; --mute:#7f9297;
  --brand:#7cc4c6; --brand-2:#93d2d3; --brand-bg:#173033; --on-brand:#0f1719;
  --red:#ef8f86; --red-bg:#3a2220; --amb:#e5c06a; --amb-bg:#342b17; --kid:#f0a26e; --kid-bg:#352419; --grn:#80cfa2; --grn-bg:#18301f;
  --hl:#4a3f14; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo .mk{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.logo b{font-size:15px;display:block;line-height:1.2}
.logo span{font-size:11.5px;color:var(--sub)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:none;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--sub);font-weight:500}
.nav button:hover{background:var(--band);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-bg);color:var(--brand);font-weight:600}
.nav .cnt{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:0 6px;border-radius:20px;background:var(--amb-bg);color:var(--amb)}
.nav .cnt.r{background:var(--red-bg);color:var(--red)}
.upbtn{border:none;background:var(--brand);color:var(--on-brand);border-radius:10px;padding:10px 12px;font-weight:600;text-align:center}
.upbtn:hover{background:var(--brand-2)}
.sec{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub);display:grid;gap:4px}
.sec b{color:var(--ink);font-size:12px}
.sec li{margin-left:14px}
.sec ul{margin:0;padding:0}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:0 6px}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--sub)}

/* main */
.main{min-width:0;padding-inline:28px;padding-block:22px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.crumb{font-size:12.5px;color:var(--sub);margin:0 0 2px}
.crumb button{border:none;background:none;padding:0;color:var(--brand);font-size:12.5px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0}
.demo{font-size:11.5px;color:var(--amb);background:var(--amb-bg);border-radius:20px;padding:2px 10px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card > header span{font-size:12px;color:var(--sub)}
.card .body{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--sub)}
.kpi.r .v{color:var(--red)} .kpi.a .v{color:var(--amb)} .kpi.b .v{color:var(--brand)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;white-space:nowrap;vertical-align:1px}
.t-red{background:var(--red-bg);color:var(--red)} .t-amb{background:var(--amb-bg);color:var(--amb)} .t-kid{background:var(--kid-bg);color:var(--kid)} .t-grn{background:var(--grn-bg);color:var(--grn)} .t-b{background:var(--brand-bg);color:var(--brand)} .t-n{background:var(--band);color:var(--sub)}
.list{list-style:none;margin:0;padding:0}
.list > li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.list > li:last-child{border-bottom:none}
.list .t{font-weight:600}
.list .d{font-size:12.5px;color:var(--sub)}
.list .w{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.pri:hover{background:var(--brand-2);color:var(--on-brand)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.cite{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--band);color:var(--brand);border-radius:5px;padding:0 5px;margin-left:3px;white-space:nowrap}
.cite:hover{border-color:var(--brand)}
.note{font-size:12px;color:var(--sub);margin:10px 0 0}
.empty{color:var(--sub);font-size:13px;margin:0}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13.5px}
.chk input{margin-top:4px}
.chk.done span{text-decoration:line-through;color:var(--mute)}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:600;background:var(--band)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--band)}
td .nm{font-weight:600}
td .sm{font-size:12px;color:var(--sub)}

/* case detail */
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chead .av{width:44px;height:44px;border-radius:12px;background:var(--brand-bg);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:16px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.tabs button{border:none;background:none;padding:9px 12px;color:var(--sub);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.bsec{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.bsec:last-child{border-bottom:none}
.bsec h3{font-size:12.5px;color:var(--sub);margin:0;font-weight:600}
.bsec ul{margin:0;padding-left:18px}
.bsec li{margin:3px 0}
.agenda{background:var(--kid-bg);border-radius:8px;padding:10px 12px}
.agenda b{color:var(--kid);font-size:12.5px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:86px 18px minmax(0,1fr);gap:8px;padding:8px 0}
.tl .dt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--brand);justify-self:center;box-shadow:0 0 0 3px var(--surface)}
.tl .dot.kid{background:var(--kid)} .tl .dot.amb{background:var(--amb)} .tl .dot.obs{background:var(--mute)} .tl .dot.call{background:var(--grn)}
.tl .tx{min-width:0}
.tl .tx small{display:block;font-size:12px;color:var(--sub)}
.who{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px;border:1px solid var(--line);color:var(--sub)}

/* transcript */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.tr{max-height:560px;overflow-y:auto;padding:6px 0}
.ln{display:grid;grid-template-columns:52px 56px minmax(0,1fr);gap:8px;padding:6px 14px;font-size:13.5px;border-left:3px solid transparent}
.ln .ts{font-family:var(--mono);font-size:11.5px;color:var(--mute);padding-top:2px}
.ln .sp{font-size:11.5px;font-weight:700;padding-top:2px}
.ln.c .sp{color:var(--sub)} .ln.k .sp{color:var(--kid)}
.ln.ev{background:var(--band)}
.ln.flash{background:var(--hl)!important;border-left-color:var(--amb)}
.ln .fl{display:block;font-size:11.5px;color:var(--amb);margin-top:2px}
.ln .fl.e{color:var(--brand)}
.sel{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.doc{display:grid;gap:12px}
.field{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.field .fh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--band);font-size:12px;color:var(--sub);font-weight:600}
.field .fb{padding:8px 10px;font-size:13.5px}
.field .fb[contenteditable]{outline:none}
.field .fb[contenteditable]:focus{background:var(--brand-bg)}
.ai{font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand-bg);border-radius:4px;padding:0 5px}
.docbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}

/* kid app */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--sub);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--brand)}
.chart .bar:hover{fill:var(--brand-2)}
.chart .hit{fill:transparent}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;z-index:40}
.rcard{border:1px solid var(--line);border-left:4px solid var(--amb);border-radius:10px;overflow:hidden;font-size:13px}
.rcard.kid{border-left-color:var(--kid)}
.rcard.b{border-left-color:var(--brand)}
.rcard .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:7px 12px;background:var(--band);font-size:12.5px}
.rcard .rb{padding:10px 12px;display:grid;gap:5px}
.f{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px}
.f > span:first-child{color:var(--sub);font-size:12px}
.rcard .ra{border-top:1px solid var(--line);padding:9px 12px;display:grid;gap:8px}
.stack{display:grid;gap:10px}

/* genogram */
.geno{width:100%;height:auto;display:block}
.geno text{fill:var(--ink);font-family:var(--font);font-size:12px}
.geno .lb{fill:var(--sub);font-size:11px}
.geno .nd{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.geno .nd.me{fill:var(--brand-bg);stroke:var(--brand);stroke-width:2.5}
.geno .ln1{stroke:var(--ink);stroke-width:1.5;fill:none}
.geno .conf{stroke:var(--amb);stroke-width:2;fill:none;stroke-dasharray:4 3}

/* feedback */
.meter{height:10px;border-radius:5px;background:var(--band);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%}

/* upload */
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--sub);display:grid;gap:8px;justify-items:center}
.drop.on{border-color:var(--brand);background:var(--brand-bg)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;color:var(--mute)}
.steps li .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.steps li.run{color:var(--ink)} .steps li.run .ic{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.ok{color:var(--ink)} .steps li.ok .ic{background:var(--brand);border-color:var(--brand)}
.steps li small{color:var(--sub);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* schedule */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:grid;gap:8px;align-content:start}
.day h3{margin:0;font-size:13px}
.day h3 span{font-weight:400;color:var(--sub);font-size:12px}
.ev{border-radius:8px;padding:7px 9px;font-size:12.5px;background:var(--band);border-left:3px solid var(--brand);display:grid;gap:2px}
.ev.visit{border-left-color:var(--grn)} .ev.meet{border-left-color:var(--mute)}
.ev b{font-size:12.5px}
.ev span{color:var(--sub);font-size:12px}
.ev button{justify-self:start;margin-top:2px}

@media (max-width:1080px){.g2,.split{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px;border-right:none;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  .nav button{white-space:nowrap}
  .sec,.me{display:none}
  .upbtn{margin-left:auto;padding:7px 10px}
  .main{padding-inline:16px}
  .g2e{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:minmax(0,1fr)}
  .ln{grid-template-columns:44px 46px minmax(0,1fr);padding:6px 10px}
  .f{grid-template-columns:minmax(0,1fr);gap:0}
  .tl li{grid-template-columns:62px 14px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><div class="mk">IS</div><div><b>I-SPOT</b><span>아동보호 상담 지원</span></div></div>

  <main class="main" id="main"></main>
</div>

function sleepChart(){
  const W=560,H=170,pl=96,pr=10,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb,n=CHECK.length,bw=Math.min(28,iw/n*0.55);
  const x=i=>pl+iw*(i+.5)/n,y=v=>pt+ih-ih*v/4;
  let g='';
  for(let v=1;v<=4;v++)g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${SLEEP[v]}</text>`;
  CHECK.forEach((c,i)=>{
    if(c.sleep){const h=ih*c.sleep/4,yy=pt+ih-h;g+=`<path class="bar" d="M${x(i)-bw/2},${pt+ih} V${yy+4} Q${x(i)-bw/2},${yy} ${x(i)-bw/2+4},${yy} H${x(i)+bw/2-4} Q${x(i)+bw/2},${yy} ${x(i)+bw/2},${yy+4} V${pt+ih} Z"/>`}
    g+=`<rect class="hit" x="${x(i)-iw/n/2}" y="${pt}" width="${iw/n}" height="${ih}" data-tip="${c.d} · 수면 : ${SLEEP[c.sleep]} · 기분 : ${esc(c.mood)}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${c.d}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 9일 수면 응답. 잘 잤어에서 거의 못 잤어 쪽으로 낮아짐">${g}</svg>`;
}

    <section class="card"><header><h2>승인 대기 추천 질문</h2></header><div class="body"><ul class="list">${RECS.filter(r=>r.st==='대기').map(r=>`<li><span class="tag t-b">지우</span><div><div class="t">${esc(r.q)}</div><div class="d">${esc(r.src)}</div></div><button class="btn" type="button" data-open="jiwoo" data-tab="kid">검토</button></li>`).join('')||'<li><span></span><span class="empty">대기 중인 질문이 없습니다.</span><span></span></li>'}</ul></div></section>
    <section class="card"><header><h2>아이 화면 원칙</h2></header><div class="body" style="font-size:13px;display:grid;gap:6px">
      <div>아이에게 나가는 질문은 고정 문항, 상담사 지정 문항, 승인된 추천 질문뿐입니다.</div>
      <div>누가·왜·언제·몇 번을 묻지 않고, 판정이나 점수를 보여주지 않습니다.</div>
      <div>앱 이름과 알림은 평범하게, 기기에는 대화를 저장하지 않습니다.</div></div></section>
  </div>`;
}

/* ===================== 면담 피드백 ===================== */
function pageFeedback(){
  const rows=[['지우 3회차','9/29',7,5,1,46],['서윤 2회차','9/26',5,8,2,58],['도윤 3회차','9/24',9,3,0,39],['하준 4회차','9/22',6,6,1,51]];
  return `<div class="top"><div><p class="crumb">최근 4회기 · 본인만 볼 수 있음</p><h1>면담 피드백</h1></div><span class="demo">가상 사례</span></div>
  <div class="grid g2">
    <section class="card"><header><h2>회기별 질문 방식</h2><span>녹취에서 상담원 발화만 분석</span></header><div class="body"><div class="tw"><table style="min-width:560px"><thead><tr><th>회기</th><th>개방형 · 폐쇄형 · 확인할 질문</th><th style="text-align:right">상담원 발화 비율</th><th></th></tr></thead><tbody>
      ${rows.map(([n,d,o,c,l,p])=>{const t=o+c+l;return `<tr style="cursor:default"><td><b>${n}</b><div class="sm" style="color:var(--sub);font-size:12px">${d}</div></td><td><div class="meter" title="개방형 ${o}, 폐쇄형 ${c}, 확인할 질문 ${l}"><i style="width:${o/t*100}%;background:var(--brand)"></i><i style="width:${c/t*100}%;background:var(--mute)"></i>${l?`<i style="width:${l/t*100}%;background:var(--amb)"></i>`:''}</div><div style="font-size:12px;color:var(--sub);margin-top:4px">개방형 ${o} · 폐쇄형 ${c} · 확인할 질문 ${l}</div></td><td style="text-align:right;font-variant-numeric:tabular-nums">${p}%</td><td>${n.startsWith('지우')?'<button class="btn" type="button" data-open="jiwoo" data-tab="session">축어록</button>':''}</td></tr>`}).join('')}
    </tbody></table></div><p class="note">색 : 청록 개방형 · 회색 폐쇄형 · 노랑 확인할 질문. 표 아래 숫자로도 읽을 수 있습니다.</p></div></section>
    <section class="card"><header><h2>다시 볼 질문</h2><span>대안 표현 제안</span></header><div class="body"><ul class="list">
      <li><span class="tag t-amb">지우</span><div><div class="t">"그럼 이제 괜찮은 거지?"</div><div class="d">답을 정해 둔 질문일 수 있음 → "요즘 집에서 지낼 때 마음은 어때?"</div></div>${cite(7)}</li>
      <li><span class="tag t-amb">서윤</span><div><div class="t">"엄마가 밥 안 챙겨줬어?"</div><div class="d">특정 사람을 넣은 예/아니오 질문 → "오늘 밥은 어떻게 먹었어?"</div></div><span class="w">2회차 07:12</span></li>
    </ul><p class="note">이 화면은 평가가 아니라 본인 점검용입니다. 수퍼비전에 가져갈지는 상담원이 정합니다.</p></div></section>
  </div>`;
}

/* ===================== 일정 ===================== */
function pageSchedule(){
  return `<div class="top"><div><p class="crumb">10월 6일 ~ 10월 10일</p><h1>일정</h1></div><span class="demo">가상 일정</span></div>
  <div class="week">${Object.entries(SCHED).map(([d,ev])=>{const [w,dd]=d.split(' ');return `<div class="day"><h3>${w} <span>${dd}</span></h3>${ev.length?ev.map(e=>`<div class="ev ${e.k}"><b>${e.t} ${esc(e.b)}</b><span>${esc(e.s)}</span>${e.open?`<button class="btn" type="button" data-open="${e.open}">브리핑</button>`:''}</div>`).join(''):'<span class="empty" style="font-size:12px">일정 없음</span>'}</div>`}).join('')}</div>
  <p class="note">상담 전날 브리핑이 자동으로 준비됩니다. 아이 앱에는 "선생님 만나는 날까지 ○일"만 표시됩니다.</p>`;
}

/* ===================== 녹취 올리기 ===================== */
let up={file:null,running:false,done:false};
function pageUpload(){
  return `<div class="top"><div><p class="crumb">상담·통화·방문 후 음성 메모</p><h1>녹취 올리기</h1></div></div>
  <div class="grid g2">
    <section class="card"><header><h2>파일과 사례 선택</h2></header><div class="body" style="display:grid;gap:12px">
      <label style="display:grid;gap:4px;font-size:13px"><span style="color:var(--sub)">사례</span><select class="sel" id="upCase">${CASES.map(c=>`<option value="${c.id}">${c.name} (${c.age})</option>`).join('')}</select></label>
      <label style="display:grid;gap:4px;font-size:13px"><span style="color:var(--sub)">종류</span><select class="sel" id="upKind"><option>대면 상담 녹취</option><option>통화 녹음</option><option>상담 직후 음성 메모 (관찰)</option><option>방문 후 음성 메모</option></select></label>
      <div class="drop" id="drop"><div><b>음성 파일을 끌어다 놓거나</b></div><div class="btns"><label class="btn" for="upFile">파일 고르기</label><input type="file" id="upFile" accept="audio/*" hidden><button class="btn" type="button" id="useSample">예시 녹취 쓰기</button></div><div id="fname" style="font-size:12.5px"></div></div>
      <label class="chk"><input type="checkbox" id="upConsent"><span>녹음 동의를 받았습니다 (아동·보호자)</span></label>
      <button class="btn pri" type="button" id="upStart" style="justify-self:start;padding:8px 14px">분석 시작</button>
      <p class="note" style="margin:0">시연 화면이라 파일은 서버로 보내지 않고, 처리 과정만 보여줍니다.</p>
    </div></section>
    <section class="card"><header><h2>처리 과정</h2><span>보안 처리 후 AI 정리</span></header><div class="body">
      <ol class="steps" id="steps">${[['암호화 저장','저장 전에 먼저 암호화'],['글로 바꾸기 · 화자 나누기','아동 · 상담원 · 보호자'],['이름·학교 가리기','기본 비식별'],['위험 신호 · 근거 확인','원문에 없는 근거는 버림'],['기록 초안 만들기','기관 일지 · 시스템 입력용 · 브리핑']].map(([a,b])=>`<li><span class="ic"></span><span>${a}<br><small>${b}</small></span><span class="w"></span></li>`).join('')}</ol>
      <div id="upDone" style="margin-top:14px"></div>
    </div></section>
  </div>`;
}
function bindUpload(){
  const f=$('#upFile');if(!f)return;
  const setName=n=>{up.file=n;$('#fname').textContent='선택됨 : '+n};
  f.onchange=()=>{if(f.files[0])setName(f.files[0].name)};
  $('#useSample').onclick=()=>setName('지우_3회차_0929.m4a (예시)');
  const d=$('#drop');
  d.ondragover=e=>{e.preventDefault();d.classList.add('on')};d.ondragleave=()=>d.classList.remove('on');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('on');const fl=e.dataTransfer.files[0];if(fl)setName(fl.name)};
  $('#upStart').onclick=async()=>{
    if(up.running)return;
    if(!up.file){toast('파일을 고르거나 예시 녹취를 써 주세요.');return}
    if(!$('#upConsent').checked){toast('녹음 동의 확인이 필요합니다.');return}
    up.running=true;const lis=[...document.querySelectorAll('#steps li')];
    const times=['0.4초','38초','2초','11초','9초'];
    for(let i=0;i<lis.length;i++){lis[i].className='run';await new Promise(r=>setTimeout(r,700));lis[i].className='ok';lis[i].querySelector('.w').textContent=times[i]}
    up.running=false;
    const cid=$('#upCase').value,c=caseOf(cid);
    $('#upDone').innerHTML=`<div class="rcard b"><div class="rh"><b>완료</b><span style="color:var(--sub)">약 1분 (예시)</span></div><div class="rb"><div>${c.name} 사례에 축어록과 기록 초안이 붙었습니다. 상담원은 확인하고 고치기만 하면 됩니다.</div><div class="btns"><button class="btn pri" type="button" data-open="jiwoo" data-tab="session">초안 확인</button></div>${cid!=='jiwoo'?'<p class="note" style="margin:0">시연 축어록은 지우 사례로 열립니다.</p>':''}</div></div>`;
  };
}

/* ===================== 렌더 ===================== */
let tipEl=null;
function bindTips(){
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove',e=>{if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl)}tipEl.textContent=el.dataset.tip;tipEl.style.left=Math.min(e.clientX+12,innerWidth-220)+'px';tipEl.style.top=(e.clientY+12)+'px'});
    el.addEventListener('mouseleave',()=>{if(tipEl){tipEl.remove();tipEl=null}});
  });
}
function render(){
  renderNav();
  const p={today:pageToday,cases:pageCases,case:pageCase,kids:pageKids,feedback:pageFeedback,schedule:pageSchedule,upload:pageUpload}[route.page];
  main.innerHTML=p();
  renderTodos();bindSession();bindKid();bindUpload();bindTips();
}
render();
</script>

</body></html>
