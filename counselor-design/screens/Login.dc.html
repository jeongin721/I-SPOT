<style>
body{margin:0;background:#F2F2F0}
*{box-sizing:border-box}
a{color:#8C7340}a:hover{color:#2B2A26}
.mk{width:40px;height:40px;border-radius:12px;background:#2B2A26;color:#EADBB5;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap}
.btn-p{background:#2B2A26;color:#EADBB5;font-weight:700}.btn-p:hover{background:#3A3833;color:#EADBB5}
.inp{height:48px;border:1px solid #DAD5C9;border-radius:12px;padding:0 16px;font:inherit;font-size:14px;background:#FFFFFF;color:#2B2A26;width:100%}
.lb{font-size:13px;font-weight:500;color:#66625A}

/* ===== 모던 베이스 + 부분 뉴모피즘 · 색상 팔레트 유지 ===== */
:root{--base:#F2F2F0;--rail:#E9E7E1;--sd:rgba(160,154,138,.30);--sl:rgba(255,255,255,.95);--line:#ECEAE4}
body{font-family:'IBM Plex Sans KR',sans-serif !important;-webkit-font-smoothing:antialiased}
h1{font-family:'IBM Plex Sans KR',sans-serif !important;letter-spacing:-.01em;font-weight:500 !important}
/* 좌측 레일 + 연결형 패널 */
.side{background:var(--rail) !important;border-right:0 !important;padding:26px 16px 22px !important}
.side+main,.side+div{background:var(--base);border-radius:36px 0 0 36px;position:relative}
.side .logo b{font-family:'Noto Serif KR',serif;font-weight:600}
.mk{background:#2B2A26 !important;color:#D9C08A !important;border-radius:50% !important;font-family:'Noto Serif KR',serif;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.cta{border-radius:999px !important;border:1px solid #2B2A26;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);transition:box-shadow .2s,transform .15s}
.cta:active{transform:translateY(1px)}
.cta2{border-radius:999px !important;background:#FFFFFF;border:1.5px solid #2B2A26;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);transition:box-shadow .2s}
.cta2:hover{background:#F7F2E6;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.nav{gap:4px;margin:20px 0 14px}
.nav a,.side[aria-label="관리자 메뉴"]>a:not(:first-child){position:relative;padding-left:34px;border-radius:999px !important;color:#5E5A52;transition:background .2s,color .2s}
.nav a:hover,.side[aria-label="관리자 메뉴"]>a:not(:first-child):hover{background:rgba(255,255,255,.55);color:#2B2A26}
.nav a.on,.side[aria-label="관리자 메뉴"]>a.on{background:var(--base) radial-gradient(circle,#C2A36B 3px,transparent 3.6px) no-repeat 15px 50%/8px 8px !important;color:#2B2A26 !important;font-weight:700;border-radius:22px 0 0 22px !important;margin-right:-16px}
.nav a.on::before,.nav a.on::after,.side[aria-label="관리자 메뉴"]>a.on::before,.side[aria-label="관리자 메뉴"]>a.on::after{content:"";position:absolute;right:0;width:24px;height:24px;pointer-events:none}
.nav a.on::before,.side[aria-label="관리자 메뉴"]>a.on::before{top:-24px;background:radial-gradient(circle at 0 0,transparent 23.5px,var(--base) 24px)}
.nav a.on::after,.side[aria-label="관리자 메뉴"]>a.on::after{bottom:-24px;background:radial-gradient(circle at 0 100%,transparent 23.5px,var(--base) 24px)}
.nav a.on .cnt,.side>a.on .badge{margin-right:16px}
.cnt,.badge{box-shadow:0 2px 6px rgba(163,59,46,.28)}
.grp{padding-left:34px !important}
.me{border-top:1px solid #DAD5C9 !important}
.av{box-shadow:inset 1px 1px 3px var(--sd),inset -1px -1px 3px var(--sl)}
.top{background:transparent !important;border-bottom:0 !important}
/* 카드: 모던 베이스(테두리) + 부드러운 그림자 */
.card{background:#FFFFFF;border:1px solid #E2DED3;border-radius:20px !important;box-shadow:6px 6px 16px var(--sd),-6px -6px 16px var(--sl)}
.hd{border-bottom-color:#EAE7DF}
.box{background:#F7F6F2;border:1px solid #EAE7DF;box-shadow:inset 1px 1px 3px var(--sd)}
/* 버튼: 경계 명확 */
.btn{border-radius:999px !important;transition:box-shadow .2s,transform .15s,background .2s,border-color .2s}
.btn-p{border:1px solid #2B2A26;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.btn-s,.btn-y{background:#FFFFFF;border:1px solid #CFC9BB;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.btn-s:hover,.btn-y:hover{border-color:#2B2A26;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.cta:focus-visible,.cta2:focus-visible{outline:2px solid #C2A36B;outline-offset:2px}
/* 입력 */
.inp,.ta{background:#FFFFFF;border:1px solid #DAD5C9;box-shadow:inset 2px 2px 4px var(--sd)}
.inp{border-radius:999px}
.inp:focus,.ta:focus{outline:2px solid #C2A36B;outline-offset:1px;border-color:#2B2A26}
.seg{background:var(--base);border:1px solid #E2DED3;border-radius:999px;padding:4px;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.seg button{border-radius:999px}
.seg button.on{background:#FFFFFF;box-shadow:0 0 0 1px #CFC9BB,2px 2px 6px var(--sd)}
.pill{border:1px solid #DAD5C9;box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl)}
.pill.on{box-shadow:inset 0 0 0 1px #2B2A26}
.tg{border-color:#CFC9BB;border-radius:999px;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
/* 표 */
.tbl th{background:#F7F6F2;border-bottom:1px solid #E2DED3;letter-spacing:.02em}
.tbl td{border-bottom-color:#F1EFEA}
/* 탭 */
.tabs{align-self:flex-start;gap:4px;padding:5px;border:1px solid #E2DED3;border-radius:999px;background:var(--base);box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.tabs a{border-bottom:0;margin-bottom:0;border-radius:999px;padding:9px 18px}
.tabs a.on{background:#FFFFFF;border-bottom-color:transparent !important;box-shadow:0 0 0 1px #CFC9BB,2px 2px 6px var(--sd)}
/* 단계 */
.stp{border-radius:999px !important;border:1px solid #DAD5C9;background:#FFFFFF;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.stp:hover{border-color:#2B2A26}
.stp.on{box-shadow:inset 0 0 0 1.5px #C2A36B,3px 3px 8px var(--sd),-3px -3px 8px var(--sl) !important;border-color:transparent}
.stp.on .sn{background:#2B2A26 !important;color:#EADBB5 !important}
/* 홈 소품 */
.todo{background:#F7F6F2;border:1px solid #EAE7DF}
.todo:hover{border-color:#CFC9BB}
.qa{border:1px solid #DAD5C9;background:#FFFFFF;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl);transition:box-shadow .2s,border-color .2s}
.qa:hover{border-color:#2B2A26;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
.lseg{display:flex;gap:4px;padding:4px;border-radius:999px;background:#F2F2F0;border:1px solid #E2DED3;box-shadow:inset 2px 2px 5px rgba(160,154,138,.30),inset -2px -2px 5px rgba(255,255,255,.95)}
.lseg button{flex:1;border:0;border-radius:999px;min-height:40px;font:inherit;font-size:14px;background:transparent;color:#66625A;cursor:pointer}
.lseg button.on{background:#FFFFFF;color:#2B2A26;font-weight:700;box-shadow:0 0 0 1px #CFC9BB,2px 2px 6px rgba(160,154,138,.30)}
