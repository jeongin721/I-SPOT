<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>I-SPOT 앱 · 메모</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F0;overflow-x:hidden}
body:has(.app.dark){background:#22211E}
*{box-sizing:border-box}
.app{--bg:#F2F2F0;--card:#FFFFFF;--line:#E7E4DC;--fg:#2B2A26;--mut:#7A776F;--soft:#F7F6F2;--sand:#F1EADA;--gold:#C2A36B;--ink:#2B2A26;--onink:#EADBB5;--red:#A33B2E;--redsoft:#F7E4DF;
  min-height:100vh;min-height:100dvh;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans KR',sans-serif;font-size:clamp(14px,4.1vw,15px);line-height:1.55;position:relative}
.app.dark{--bg:#22211E;--card:#2C2B27;--line:#45423B;--fg:#ECE8DF;--mut:#A8A296;--soft:#33312C;--sand:#3F3729;--ink:#EADBB5;--onink:#2B2A26;--red:#F0907F;--redsoft:#4A2B26}
.app a{color:inherit;text-decoration:none}
.app a.btn-p{color:var(--onink)}
.app a.fail{color:var(--red)}
.ahd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top,0px));background:var(--bg)}
.ahd h1{margin:0;font-size:clamp(18px,5.6vw,21px);font-weight:700;letter-spacing:-.01em}
.ahd .sub{font-size:12.5px;color:var(--mut)}
.ibtn{position:relative;width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;padding:0}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.amain{flex:1;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec-t{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-red{color:var(--red)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.red{background:var(--redsoft);color:var(--red)}
.chip.gold{background:var(--sand);color:var(--fg)}
.chip.ai{gap:4px;background:#F3EAD3;color:#7A5F28}
.app.dark .chip.ai{background:#3F3729;color:#EADBB5}
.chip.ai::before{content:"";width:11px;height:11px;flex:none;background:currentColor;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.1 6.4L20.5 10.5l-6.4 2.1L12 19l-2.1-6.4L3.5 10.5l6.4-2.1z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.1 6.4L20.5 10.5l-6.4 2.1L12 19l-2.1-6.4L3.5 10.5l6.4-2.1z'/></svg>") center/contain no-repeat}
.note{font-size:12.5px;color:var(--mut)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:var(--card);color:var(--fg)}
textarea.inp{padding:10px 12px;line-height:1.6;resize:vertical}
.fl{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(43,42,38,.14)}
.fail{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--redsoft);color:var(--red);font-size:14px;font-weight:700}
.fail span{flex:1}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.ahd .tl{flex:1;min-width:0}
.ahd .tl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amain{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,42,38,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--card);color:var(--fg);border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sh-hd{display:flex;align-items:center;gap:10px}
.sh-hd b{flex:1;font-size:18px}
.nt{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.nt.red{border-color:var(--red)}
.nt b{font-size:14.5px}
.row-k{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.row-k:first-child{border-top:0}
.row-k span:first-child{color:var(--mut);font-size:13px}

.mi{display:flex;flex-direction:column;gap:6px;padding:14px;cursor:pointer}
.mi-top{display:flex;align-items:center;gap:8px}
.mi p{margin:0;font-size:14.5px;white-space:pre-wrap}
</style>
</helmet>
<div class="{{ rootCls }}">
<header class="ahd"><a class="{{ homeCls }}" href="AppHome.dc.html" aria-label="홈으로" aria-current="{{ homeCur }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"></path><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"></path></svg></a><div class="tl"><div class="sub">현장에서 바로 적어 두기</div><h1>메모</h1></div><button type="button" class="ibtn" aria-label="알림 {{ ntCount }}건" onClick="{{ ntToggle }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.2 1.4 6 2.2 6.9a.6.6 0 0 1-.45 1H4.25a.6.6 0 0 1-.45-1C4.6 15.5 6 13.7 6 9.5z"></path><path d="M10 20.2a2.2 2.2 0 0 0 4 0"></path></svg><sc-if value="{{ ntHas }}" hint-placeholder-val="{{ true }}"><span class="badge">{{ ntCount }}</span></sc-if></button><a class="{{ setCls }}" href="AppSettings.dc.html" aria-label="설정" aria-current="{{ setCur }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a></header>
<main class="amain">
<section class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 10px;" aria-label="새 메모">
<select class="inp" value="{{ nChild }}" onChange="{{ setNChild }}" aria-label="관련 아이"><option value="">관련 아이 선택 안 함</option><sc-for list="{{ kidOpts }}" as="k" hint-placeholder-count="10"><option>{{ k }}</option></sc-for></select>
<textarea class="inp" rows="3" placeholder="메모를 적어 주세요" value="{{ nText }}" onChange="{{ setNText }}" aria-label="메모 내용"></textarea>
<button type="button" class="btn btn-p" onClick="{{ add }}">메모 저장</button>
</section>
<p class="sec-t">최근 메모 · {{ count }}개</p>
<sc-for list="{{ memos }}" as="m" hint-placeholder-count="3"><div class="card mi" role="button" tabindex="0" onClick="{{ m.open }}"><div class="mi-top"><sc-if value="{{ m.hasChild }}" hint-placeholder-val="{{ true }}"><span class="chip gold">{{ m.child }}</span></sc-if><span class="note" style="margin-left: auto;">{{ m.t }}</span></div><p>{{ m.text }}</p></div></sc-for>
</main>

<sc-if value="{{ shOpen }}" hint-placeholder-val="{{ false }}"><div class="ov" onClick="{{ shClose }}"><section class="sheet" role="dialog" aria-modal="true" aria-label="메모 수정" onClick="{{ stop }}">
<span class="grab" aria-hidden="true"></span><div class="sh-hd"><b>메모</b><span class="note">{{ eT }}</span></div>
<select class="inp" value="{{ eChild }}" onChange="{{ setEChild }}" aria-label="관련 아이"><option value="">관련 아이 선택 안 함</option><sc-for list="{{ kidOpts }}" as="k" hint-placeholder-count="10"><option>{{ k }}</option></sc-for></select>
<textarea class="inp" rows="5" value="{{ eText }}" onChange="{{ setEText }}" aria-label="메모 내용"></textarea>
<sc-if value="{{ noAsk }}" hint-placeholder-val="{{ true }}"><div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;"><button type="button" class="btn btn-red" onClick="{{ askDel }}">삭제</button><button type="button" class="btn btn-p" onClick="{{ saveEdit }}">수정 저장</button></div></sc-if>
<sc-if value="{{ ask }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--redsoft);"><b style="color: var(--red);">이 메모를 삭제할까요?</b><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"><button type="button" class="btn" onClick="{{ cancelDel }}">취소</button><button type="button" class="btn" style="background: var(--red); border-color: var(--red); color: #FFFFFF;" onClick="{{ del }}">삭제</button></div></div></sc-if>
</section></div></sc-if>
<sc-if value="{{ ntOpen }}" hint-placeholder-val="{{ false }}"><div class="ov" onClick="{{ ntClose }}"><section class="sheet" role="dialog" aria-modal="true" aria-label="알림" onClick="{{ stop }}">
<span class="grab" aria-hidden="true"></span><div class="sh-hd"><b>알림</b><button type="button" class="btn btn-sm" onClick="{{ ntClose }}">닫기</button></div>
<sc-for list="{{ notes }}" as="n" hint-placeholder-count="2"><div class="nt {{ n.red }}"><b>{{ n.title }}</b><span class="note">{{ n.sub }}</span><sc-if value="{{ n.desc }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px;">{{ n.desc }}</span></sc-if>
<sc-if value="{{ n.hasAct }}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-p" style="align-self: flex-start;" onClick="{{ n.go }}">{{ n.act }}</button></sc-if>
<sc-if value="{{ n.hasLink }}" hint-placeholder-val="{{ false }}"><a class="btn btn-sm" style="align-self: flex-start;" href="{{ n.href }}">{{ n.linkLabel }}</a></sc-if></div></sc-for>
</section></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {

stGet(k) { let v = null; try { v = window.localStorage.getItem(k); } catch (e) {} if (!v) { try { v = window.sessionStorage.getItem(k); } catch (e) {} } if (!v) { try { v = (window.top.__ispotSt || {})[k]; } catch (e) {} } if (!v) v = (window.__ispotSt || {})[k]; return v || ''; }
stSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} try { window.sessionStorage.setItem(k, v); } catch (e) {} try { window.top.__ispotSt = window.top.__ispotSt || {}; window.top.__ispotSt[k] = v; } catch (e) {} window.__ispotSt = window.__ispotSt || {}; window.__ispotSt[k] = v; }
themeRead() { let v = null; try { v = window.localStorage.getItem('ispot-theme'); } catch (e) {} if (!v) { try { v = window.sessionStorage.getItem('ispot-theme'); } catch (e) {} } if (!v) { try { v = window.top.__ispotTheme; } catch (e) {} } if (!v) v = window.__ispotTheme; return v === 'dark'; }
qRead() { let a = null; try { a = JSON.parse(this.stGet('ispot-app-q') || 'null'); } catch (e) {} if (!Array.isArray(a)) { a = [
  { id: 'q1', name: '서윤_8회차_방문상담.m4a', kind: '녹음', who: '이서윤 · 8회차', size: '23.4MB', status: 'fail', err: '네트워크 연결이 끊겨 올리지 못했어요', t: '오늘 15:42' },
  { id: 'q2', name: '가정방문_사진_01.jpg', kind: '사진', who: '김도현', size: '2.1MB', status: 'done', t: '오늘 11:05' },
  { id: 'q3', name: '학교_상담확인서.pdf', kind: '문서', who: '박지호', size: '480KB', status: 'done', t: '어제 17:20' }]; this.stSet('ispot-app-q', JSON.stringify(a)); } return a; }
qWrite(a) { this.stSet('ispot-app-q', JSON.stringify(a)); this.setState({ __q: Date.now() }); }
qSet(id, patch) { this.qWrite(this.qRead().map((x) => (x.id === id ? { ...x, ...patch } : x))); }
qRetry(id) { this.qSet(id, { status: 'run', err: '' }); setTimeout(() => { try { this.qSet(id, { status: 'done', t: '방금' }); } catch (e) {} }, 1800); }
qAdd(item) { const id = 'q' + Date.now().toString(36); this.qWrite([{ id, status: 'run', t: '방금', ...item }, ...this.qRead()]); setTimeout(() => { try { this.qSet(id, { status: 'done' }); } catch (e) {} }, 2000); return id; }
kids() { return ['서윤', '지호', '도현', '예린', '하은', '서준', '시우', '하린', '유나', '민준']; }
componentDidMount() {
  this._raw = this.stGet('ispot-app-q') + '|' + this.themeRead();
  this._t = setInterval(() => { const r = this.stGet('ispot-app-q') + '|' + this.themeRead(); if (r !== this._raw) { this._raw = r; this.setState({ __t: Date.now() }); } }, 600);
  if (this.mountExtra) this.mountExtra();
}
componentWillUnmount() { clearInterval(this._t); clearInterval(this._recT); }
commonVals(cur) {
  const q = this.qRead(); const fails = q.filter((x) => x.status === 'fail'); const st = this.state || {};
  const notes = fails.map((x) => ({ red: 'red', title: '업로드 실패 · ' + x.kind, sub: x.name + ' · ' + x.t, desc: x.err || '', hasAct: true, act: '다시 올리기', go: () => this.qRetry(x.id), hasLink: false, href: '', linkLabel: '' }))
    .concat([{ red: '', title: '상담 전 브리핑이 준비됐어요', sub: '오늘 16:00 · 이서윤 · 9회차 정기상담', desc: '', hasAct: false, act: '', go: () => {}, hasLink: true, href: 'AppBrief.dc.html', linkLabel: '브리핑 보기' },
      { red: '', title: '오늘 남은 상담 2건', sub: '14:00 박지호 · 16:00 이서윤', desc: '', hasAct: false, act: '', go: () => {}, hasLink: true, href: 'AppSchedule.dc.html', linkLabel: '일정 보기' }]);
  return {
    rootCls: this.themeRead() ? 'app dark' : 'app',
    homeCls: cur === 'home' ? 'ibtn on' : 'ibtn', setCls: cur === 'set' ? 'ibtn on' : 'ibtn', homeCur: cur === 'home' ? 'page' : 'false', setCur: cur === 'set' ? 'page' : 'false',
    ntCount: String(notes.length), ntHas: notes.length > 0, ntOpen: !!st.__nt, ntToggle: () => this.setState({ __nt: !st.__nt }), ntClose: () => this.setState({ __nt: false }), notes,
    failN: fails.length, hasFail: fails.length > 0, failText: '업로드 실패 ' + fails.length + '건 · 다시 올려 주세요'
  };
}


constructor(props) { super(props); this.state = { nChild: '', nText: '', edit: null, ask: false }; }
mRead() { let a = null; try { a = JSON.parse(this.stGet('ispot-app-memo') || 'null'); } catch (e) {} if (!Array.isArray(a)) { a = [
  { id: 'm1', child: '서윤', text: '현관 앞에서 만남. 아버지 차량 없음.\n다음 방문 때 할머니 연락처 다시 확인하기.', t: '오늘 15:20' },
  { id: 'm2', child: '', text: '금요일 오전 슈퍼비전 자료 준비', t: '어제 18:02' },
  { id: 'm3', child: '도현', text: '학교 담임 선생님과 통화 예정 (11/2 오전)', t: '10/27 09:40' }]; this.stSet('ispot-app-memo', JSON.stringify(a)); } return a; }
mWrite(a) { this.stSet('ispot-app-memo', JSON.stringify(a)); this.setState({ __m: Date.now() }); }
renderVals() {
  const s = this.state; const M = this.mRead(); const e = s.edit || {};
  return Object.assign(this.commonVals('memo'), { stop: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); }, kidOpts: this.kids(),
    nChild: s.nChild, nText: s.nText, setNChild: (ev) => this.setState({ nChild: ev.target.value }), setNText: (ev) => this.setState({ nText: ev.target.value }),
    add: () => { const t = (this.state.nText || '').trim(); if (!t) return; this.mWrite([{ id: 'm' + Date.now().toString(36), child: this.state.nChild, text: t, t: '방금' }, ...this.mRead()]); this.setState({ nText: '' }); },
    count: String(M.length), memos: M.map((m) => ({ child: m.child, hasChild: !!m.child, t: m.t, text: m.text, open: () => this.setState({ edit: { id: m.id, child: m.child, text: m.text, t: m.t }, ask: false }) })),
    shOpen: !!s.edit, shClose: () => this.setState({ edit: null, ask: false }), eChild: e.child || '', eText: e.text || '', eT: e.t || '',
    setEChild: (ev) => this.setState({ edit: { ...this.state.edit, child: ev.target.value } }), setEText: (ev) => this.setState({ edit: { ...this.state.edit, text: ev.target.value } }),
    saveEdit: () => { const ed = this.state.edit; if (!(ed.text || '').trim()) return; this.mWrite(this.mRead().map((m) => (m.id === ed.id ? { ...m, child: ed.child, text: ed.text.trim() } : m))); this.setState({ edit: null }); },
    ask: !!s.ask, noAsk: !s.ask, askDel: () => this.setState({ ask: true }), cancelDel: () => this.setState({ ask: false }),
    del: () => { this.mWrite(this.mRead().filter((m) => m.id !== this.state.edit.id)); this.setState({ edit: null, ask: false }); } });
}

}
</script>
</body>
</html>
