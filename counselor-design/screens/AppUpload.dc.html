<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>I-SPOT 앱 · 업로드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F0}
*{box-sizing:border-box}
.app{--bg:#F2F2F0;--card:#FFFFFF;--line:#E7E4DC;--fg:#2B2A26;--mut:#7A776F;--soft:#F7F6F2;--sand:#F1EADA;--gold:#C2A36B;--ink:#2B2A26;--onink:#EADBB5;--red:#A33B2E;--redsoft:#F7E4DF;
  min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans KR',sans-serif;font-size:15px;line-height:1.55;position:relative}
.app.dark{--bg:#22211E;--card:#2C2B27;--line:#45423B;--fg:#ECE8DF;--mut:#A8A296;--soft:#33312C;--sand:#3F3729;--ink:#EADBB5;--onink:#2B2A26;--red:#F0907F;--redsoft:#4A2B26}
.app a{color:inherit;text-decoration:none}
.app a.btn-p{color:var(--onink)}
.app a.fail{color:var(--red)}
.ahd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--bg)}
.ahd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ahd .sub{font-size:12.5px;color:var(--mut)}
.ibtn{position:relative;width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;padding:0}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.amain{flex:1;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec-t{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-red{color:var(--red)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.red{background:var(--redsoft);color:var(--red)}
.chip.gold{background:var(--sand);color:var(--fg)}
.note{font-size:12.5px;color:var(--mut)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:var(--card);color:var(--fg)}
textarea.inp{padding:10px 12px;line-height:1.6;resize:vertical}
.fl{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(43,42,38,.14)}
.fail{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--redsoft);color:var(--red);font-size:14px;font-weight:700}
.fail span{flex:1}
.tabs{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;font-weight:500;color:var(--mut)}
.tab.on{color:var(--fg);font-weight:700}
.tab.on svg{color:var(--gold)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,42,38,.42);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--card);color:var(--fg);border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sh-hd{display:flex;align-items:center;gap:10px}
.sh-hd b{flex:1;font-size:18px}
.nt{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.nt.red{border-color:var(--red)}
.nt b{font-size:14.5px}
.row-k{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.row-k:first-child{border-top:0}
.row-k span:first-child{color:var(--mut);font-size:13px}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card);font-size:14.5px;font-weight:700;cursor:pointer;text-align:center}
.pk input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pk-i{width:40px;height:40px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.qi{display:flex;flex-direction:column;gap:8px;padding:14px}
.qi-top{display:flex;align-items:flex-start;gap:10px}
.qi-top b{font-size:14.5px;overflow-wrap:anywhere}
.qi.f{border-color:var(--red)}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog span{display:block;height:100%;width:60%;background:var(--gold);animation:pg 1.2s ease-in-out infinite}
@keyframes pg{0%{transform:translateX(-100%)}100%{transform:translateX(170%)}}
@media (prefers-reduced-motion: reduce){.prog span{animation:none}}
</style>
</helmet>
<div class="{{ rootCls }}">
<header class="ahd"><div style="flex: 1;"><div class="sub">사진 · 문서 · 음성 파일</div><h1>업로드</h1></div><button type="button" class="ibtn" aria-label="알림 {{ ntCount }}건" onClick="{{ ntToggle }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.2 1.4 6 2.2 6.9a.6.6 0 0 1-.45 1H4.25a.6.6 0 0 1-.45-1C4.6 15.5 6 13.7 6 9.5z"></path><path d="M10 20.2a2.2 2.2 0 0 0 4 0"></path></svg><sc-if value="{{ ntHas }}" hint-placeholder-val="{{ true }}"><span class="badge">{{ ntCount }}</span></sc-if></button></header>
<main class="amain">
<label class="fl"><span class="lb">어느 아이의 자료인가요?</span><select class="inp" value="{{ child }}" onChange="{{ setChild }}"><sc-for list="{{ kidOpts }}" as="k" hint-placeholder-count="10"><option>{{ k }}</option></sc-for></select></label>
<div class="pick">
<label class="pk"><span class="pk-i"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg></span>사진 찍기<input type="file" accept="image/*" capture="environment" aria-label="사진 찍어 올리기" onChange="{{ pickFile }}"></label>
<label class="pk"><span class="pk-i"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg></span>파일 선택<input type="file" aria-label="파일 선택해서 올리기" onChange="{{ pickFile }}"></label>
</div>
<p class="sec-t">올린 자료 <span class="note">· 실패 {{ failN }}건</span></p>
<sc-for list="{{ items }}" as="x" hint-placeholder-count="3"><div class="{{ x.cls }}">
<div class="qi-top"><span class="chip">{{ x.kind }}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><b>{{ x.name }}</b><span class="note">{{ x.who }} · {{ x.size }} · {{ x.t }}</span></span><span class="{{ x.stCls }}">{{ x.st }}</span></div>
<sc-if value="{{ x.run }}" hint-placeholder-val="{{ false }}"><div class="prog"><span></span></div></sc-if>
<sc-if value="{{ x.fail }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; color: var(--red);">{{ x.err }}</span><div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;"><button type="button" class="btn btn-sm btn-red" onClick="{{ x.remove }}">지우기</button><button type="button" class="btn btn-sm btn-p" onClick="{{ x.retry }}">다시 올리기</button></div></sc-if>
</div></sc-for>
<p class="note" style="margin: 0;">올린 자료는 웹의 사례 문서함에 들어가요.</p>
</main>
<nav class="tabs" aria-label="앱 메뉴"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><a class="{{ t.cls }}" href="{{ t.href }}" aria-current="{{ t.cur }}"><sc-if value="{{ t.isRec }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></sc-if><sc-if value="{{ t.isUp }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg></sc-if><sc-if value="{{ t.isCal }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></sc-if><sc-if value="{{ t.isMemo }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg></sc-if><span>{{ t.label }}</span></a></sc-for></nav><sc-if value="{{ ntOpen }}" hint-placeholder-val="{{ false }}"><div class="ov" onClick="{{ ntClose }}"><section class="sheet" role="dialog" aria-modal="true" aria-label="알림" onClick="{{ stop }}">
<span class="grab" aria-hidden="true"></span><div class="sh-hd"><b>알림</b><button type="button" class="btn btn-sm" onClick="{{ ntClose }}">닫기</button></div>
<sc-for list="{{ notes }}" as="n" hint-placeholder-count="2"><div class="nt {{ n.red }}"><b>{{ n.title }}</b><span class="note">{{ n.sub }}</span><sc-if value="{{ n.desc }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px;">{{ n.desc }}</span></sc-if>
<sc-if value="{{ n.hasAct }}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-p" style="align-self: flex-start;" onClick="{{ n.go }}">{{ n.act }}</button></sc-if>
<sc-if value="{{ n.hasLink }}" hint-placeholder-val="{{ false }}"><a class="btn btn-sm" style="align-self: flex-start;" href="{{ n.href }}">브리핑 보기</a></sc-if></div></sc-for>
</section></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

stGet(k) { let v = null; try { v = window.localStorage.getItem(k); } catch (e) {} if (!v) { try { v = window.sessionStorage.getItem(k); } catch (e) {} } if (!v) { try { v = (window.top.__ispotSt || {})[k]; } catch (e) {} } if (!v) v = (window.__ispotSt || {})[k]; return v || ''; }
stSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} try { window.sessionStorage.setItem(k, v); } catch (e) {} try { window.top.__ispotSt = window.top.__ispotSt || {}; window.top.__ispotSt[k] = v; } catch (e) {} window.__ispotSt = window.__ispotSt || {}; window.__ispotSt[k] = v; }
themeRead() { let v = null; try { v = window.localStorage.getItem('ispot-theme'); } catch (e) {} if (!v) { try { v = window.sessionStorage.getItem('ispot-theme'); } catch (e) {} } if (!v) { try { v = window.top.__ispotTheme; } catch (e) {} } if (!v) v = window.__ispotTheme; return v === 'dark'; }
qRead() { let a = null; try { a = JSON.parse(this.stGet('ispot-app-q') || 'null'); } catch (e) {} if (!Array.isArray(a)) { a = [
  { id: 'q1', name: '서윤_8회차_방문상담.m4a', kind: '녹음', who: '이서윤 · 8회차', size: '23.4MB', status: 'fail', err: '네트워크 연결이 끊겨 올리지 못했어요', t: '오늘 15:42' },
  { id: 'q2', name: '가정방문_사진_01.jpg', kind: '사진', who: '김도현', size: '2.1MB', status: 'done', t: '오늘 11:05' },
  { id: 'q3', name: '학교_상담확인서.pdf', kind: '문서', who: '박지호', size: '480KB', status: 'done', t: '어제 17:20' }]; this.stSet('ispot-app-q', JSON.stringify(a)); } return a; }
qWrite(a) { this.stSet('ispot-app-q', JSON.stringify(a)); this.setState({ __q: Date.now() }); }
qSet(id, patch) { this.qWrite(this.qRead().map((x) => (x.id === id ? { ...x, ...patch } : x))); }
qRetry(id) { this.qSet(id, { status: 'run', err: '' }); setTimeout(() => { try { this.qSet(id, { status: 'done', t: '방금' }); } catch (e) {} }, 1800); }
qAdd(item) { const id = 'q' + Date.now().toString(36); this.qWrite([{ id, status: 'run', t: '방금', ...item }, ...this.qRead()]); setTimeout(() => { try { this.qSet(id, { status: 'done' }); } catch (e) {} }, 2000); return id; }
kids() { return ['서윤', '지호', '도현', '예린', '하은', '서준', '시우', '하린', '유나', '민준']; }
componentDidMount() {
  this._raw = this.stGet('ispot-app-q') + '|' + this.themeRead();
  this._t = setInterval(() => { const r = this.stGet('ispot-app-q') + '|' + this.themeRead(); if (r !== this._raw) { this._raw = r; this.setState({ __t: Date.now() }); } }, 600);
  if (this.mountExtra) this.mountExtra();
}
componentWillUnmount() { clearInterval(this._t); clearInterval(this._recT); }
commonVals(cur) {
  const q = this.qRead(); const fails = q.filter((x) => x.status === 'fail'); const st = this.state || {};
  const T = [['rec', '녹음', 'AppRecord.dc.html'], ['up', '업로드', 'AppUpload.dc.html'], ['cal', '일정', 'AppSchedule.dc.html'], ['memo', '메모', 'AppMemo.dc.html']];
  const notes = fails.map((x) => ({ red: 'red', title: '업로드 실패 · ' + x.kind, sub: x.name + ' · ' + x.t, desc: x.err || '', hasAct: true, act: '다시 올리기', go: () => this.qRetry(x.id), hasLink: false, href: '' }))
    .concat([{ red: '', title: '상담 전 브리핑이 준비됐어요', sub: '오늘 16:00 · 이서윤 · 9회차 정기상담', desc: '', hasAct: false, act: '', go: () => {}, hasLink: true, href: 'AppBrief.dc.html' }]);
  return {
    rootCls: this.themeRead() ? 'app dark' : 'app',
    tabs: T.map(([k, label, href]) => ({ label, href, cls: k === cur ? 'tab on' : 'tab', cur: k === cur ? 'page' : 'false', isRec: k === 'rec', isUp: k === 'up', isCal: k === 'cal', isMemo: k === 'memo' })),
    ntCount: String(notes.length), ntHas: notes.length > 0, ntOpen: !!st.__nt, ntToggle: () => this.setState({ __nt: !st.__nt }), ntClose: () => this.setState({ __nt: false }), notes,
    failN: fails.length, hasFail: fails.length > 0, failText: '업로드 실패 ' + fails.length + '건 · 다시 올려 주세요'
  };
}


constructor(props) { super(props); this.state = { child: '서윤' }; }
renderVals() {
  const s = this.state; const q = this.qRead();
  const kindOf = (n) => (/\.(jpg|jpeg|png|heic|gif|webp)$/i.test(n) ? '사진' : /\.(m4a|mp3|wav|aac)$/i.test(n) ? '녹음' : '문서');
  const size = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB');
  return Object.assign(this.commonVals('up'), { stop: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); },
    kidOpts: this.kids(), child: s.child, setChild: (ev) => this.setState({ child: ev.target.value }),
    pickFile: (ev) => { const fl = ev && ev.target && ev.target.files && ev.target.files[0]; if (!fl) return; this.qAdd({ name: fl.name, kind: kindOf(fl.name), who: this.state.child, size: size(fl.size || 0) }); try { ev.target.value = ''; } catch (e) {} },
    items: q.map((x) => ({ name: x.name, kind: x.kind, who: x.who, size: x.size, t: x.t, err: x.err || '', cls: x.status === 'fail' ? 'card qi f' : 'card qi',
      st: x.status === 'fail' ? '실패' : x.status === 'run' ? '올리는 중' : '완료', stCls: x.status === 'fail' ? 'chip red' : x.status === 'run' ? 'chip gold' : 'chip',
      run: x.status === 'run', fail: x.status === 'fail', retry: () => this.qRetry(x.id), remove: () => this.qWrite(this.qRead().filter((y) => y.id !== x.id)) })) });
}

}
</script>
</body>
</html>
