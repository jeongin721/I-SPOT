<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>I-SPOT 앱 · 업로드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F0;overflow-x:hidden}
body:has(.app.dark){background:#22211E}
*{box-sizing:border-box}
.app{--bg:#F2F2F0;--card:#FFFFFF;--line:#E7E4DC;--fg:#2B2A26;--mut:#7A776F;--soft:#F7F6F2;--sand:#F1EADA;--gold:#C2A36B;--ink:#2B2A26;--onink:#EADBB5;--red:#A33B2E;--redsoft:#F7E4DF;
  min-height:100vh;min-height:100dvh;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans KR',sans-serif;font-size:clamp(14px,4.1vw,15px);line-height:1.55;position:relative}
.app.dark{--bg:#22211E;--card:#2C2B27;--line:#45423B;--fg:#ECE8DF;--mut:#A8A296;--soft:#33312C;--sand:#3F3729;--ink:#EADBB5;--onink:#2B2A26;--red:#F0907F;--redsoft:#4A2B26}
.app a{color:inherit;text-decoration:none}
.app a.btn-p{color:var(--onink)}
.app a.fail{color:var(--red)}
.ahd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top,0px));background:var(--bg)}
.ahd h1{margin:0;font-size:clamp(18px,5.6vw,21px);font-weight:700;letter-spacing:-.01em}
.ahd .sub{font-size:12.5px;color:var(--mut)}
.ibtn{position:relative;width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;padding:0}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.amain{flex:1;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec-t{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-red{color:var(--red)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.red{background:var(--redsoft);color:var(--red)}
.chip.gold{background:var(--sand);color:var(--fg)}
.chip.ai{gap:4px;background:#F3EAD3;color:#7A5F28}
.app.dark .chip.ai{background:#3F3729;color:#EADBB5}
.chip.ai::before{content:"";width:11px;height:11px;flex:none;background:currentColor;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.1 6.4L20.5 10.5l-6.4 2.1L12 19l-2.1-6.4L3.5 10.5l6.4-2.1z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.1 6.4L20.5 10.5l-6.4 2.1L12 19l-2.1-6.4L3.5 10.5l6.4-2.1z'/></svg>") center/contain no-repeat}
.note{font-size:12.5px;color:var(--mut)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:var(--card);color:var(--fg)}
textarea.inp{padding:10px 12px;line-height:1.6;resize:vertical}
.fl{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(43,42,38,.14)}
.fail{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--redsoft);color:var(--red);font-size:14px;font-weight:700}
.fail span{flex:1}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.tabs{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(43,42,38,.05)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:12px;font-size:12.5px;font-weight:500;color:var(--mut)}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--sand);color:var(--fg);font-weight:700}
.tab.on svg{color:var(--fg)}
.ahd .tl{flex:1;min-width:0}
.ahd .tl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amain{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,42,38,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:86vh;max-height:86dvh;overflow-y:auto;background:var(--card);color:var(--fg);border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sh-hd{display:flex;align-items:center;gap:10px}
.sh-hd b{flex:1;font-size:18px}
.nt{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.nt.red{border-color:var(--red)}
.nt b{font-size:14.5px}
.row-k{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.row-k:first-child{border-top:0}
.row-k span:first-child{color:var(--mut);font-size:13px}

.pk1{width:100%;min-height:112px;font:inherit;font-size:15px;font-weight:700;color:var(--fg)}
.pko{display:flex;flex-direction:column}
.pkr{position:relative;display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.pkr:first-child{border-top:0}
.pkr input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pkr-t{display:flex;flex-direction:column;gap:1px}
.pkr-t b{font-size:15px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card);font-size:14.5px;font-weight:700;cursor:pointer;text-align:center}
.pk input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pk-i{width:40px;height:40px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.qi{display:flex;flex-direction:column;gap:8px;padding:14px}
.qi-top{display:flex;align-items:flex-start;gap:10px}
.qi-top b{font-size:14.5px;overflow-wrap:anywhere}
.qi.f{border-color:var(--red)}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog span{display:block;height:100%;width:60%;background:var(--gold);animation:pg 1.2s ease-in-out infinite}
@keyframes pg{0%{transform:translateX(-100%)}100%{transform:translateX(170%)}}
@media (prefers-reduced-motion: reduce){.prog span{animation:none}}

/* ===== 모던 정리 (2026-11-02) ===== */
.app{--bgA:rgba(242,242,240,.86);--cardA:rgba(255,255,255,.9);--track:rgba(43,42,38,.06);--goldT:#8C7340;--sh:0 1px 2px rgba(43,42,38,.04),0 6px 16px rgba(43,42,38,.04);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.app.dark{--bgA:rgba(34,33,30,.86);--cardA:rgba(44,43,39,.92);--track:rgba(255,255,255,.07);--goldT:#D9C08A;--sh:none}
.ahd{background:var(--bgA);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);gap:2px;padding:8px 10px 8px 8px;padding-top:max(8px,env(safe-area-inset-top,0px))}
.ahd .tl{padding:0 6px}
.ahd h1{font-size:clamp(18px,5.4vw,20px);letter-spacing:-.025em;line-height:1.3}
.ahd .sub{font-size:12px;font-weight:500}
.ibtn{width:42px;height:42px;border:0;border-radius:12px;background:transparent;transition:background .15s}
.ibtn:hover{background:var(--track)}
.ibtn.on{background:var(--sand);color:var(--fg)}
.badge{top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;font-size:10px;line-height:16px;box-shadow:0 0 0 2px var(--bg)}
.amain{gap:14px;padding:6px 16px 28px}
.card{border-radius:16px;box-shadow:var(--sh)}
.sec-t{margin:8px 2px -4px;font-size:12.5px;font-weight:600;letter-spacing:.01em}
.btn{min-height:46px;border-radius:12px;font-weight:600;letter-spacing:-.01em;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-p{box-shadow:0 2px 8px rgba(43,42,38,.16)}
.app.dark .btn-p{box-shadow:none}
.btn-sm{min-height:36px;border-radius:10px;font-size:13px}
.chip{height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.inp{min-height:46px;border-radius:12px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,163,107,.22)}
.lb{font-size:12.5px;font-weight:600;color:var(--mut)}
.seg{border:0;padding:3px;background:var(--track)}
.seg button{min-height:36px;border-radius:10px;font-weight:500}
.seg button.on{font-weight:600;box-shadow:0 1px 2px rgba(43,42,38,.08),0 2px 8px rgba(43,42,38,.06)}
.fail{border-radius:14px;font-weight:600;border:1px solid rgba(163,59,46,.2)}
.tabs{background:var(--cardA);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);box-shadow:none;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{min-height:54px;gap:3px;border-radius:0;font-size:11.5px;font-weight:500}
.tab .ti{display:inline-flex;align-items:center;justify-content:center;width:54px;height:30px;border-radius:999px;transition:background .15s}
.tab.on{background:transparent;color:var(--fg);font-weight:700}
.tab.on .ti{background:var(--sand)}
.tab.on:not(.tab-rec) .ti{background:transparent}
.tab .ti .fi1{display:none}
.tab.on:not(.tab-rec) .ti svg{display:none}
.tab.on:not(.tab-rec) .ti svg.fi1{display:block;color:var(--ink)}
.tabs{grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;isolation:isolate}
.tabs::before{content:"";position:absolute;left:50%;top:-30px;width:92px;height:92px;transform:translateX(-50%);border-radius:50%;background:var(--card);border:1px solid var(--line);clip-path:inset(0 0 calc(100% - 31px) 0);z-index:-1}
.tab-rec{justify-content:flex-start;padding-top:0}
.tab-rec .ti{width:66px;height:66px;margin-top:-25px;border-radius:50%;background:var(--ink);color:var(--onink);border:0;box-shadow:0 6px 16px rgba(43,42,38,.28)}
.tab-rec .ti svg{width:28px;height:28px}
.tab-rec.on .ti{background:var(--onink);color:var(--ink);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold),0 6px 16px rgba(43,42,38,.28)}
.tab-rec.on .ti svg{color:var(--ink)}
.app.dark .tab-rec .ti{box-shadow:none}
.app.dark .tab-rec.on .ti{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.ov{background:rgba(43,42,38,.38)}
.sheet{border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(43,42,38,.12)}
.sh-hd b{letter-spacing:-.02em}
.nt{border-radius:14px;background:var(--soft);border-color:transparent}
.nt.red{background:var(--redsoft);border-color:transparent}
.nt.red b{color:var(--red)}
.row-k{padding:12px 0}

.pk{min-height:108px;border-radius:16px}
.pk-i{width:46px;height:46px;border-radius:14px;background:var(--sand)}
.qi{padding:14px 16px}
.qi.f{border-color:rgba(163,59,46,.45)}
.prog{height:4px}
</style>
</helmet>
<div class="{{ rootCls }}">
<header class="ahd"><div class="tl"><div class="sub">사진 · 문서 · 음성 파일</div><h1>업로드</h1></div><button type="button" class="ibtn" aria-label="알림 {{ ntCount }}건" onClick="{{ ntToggle }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.2 1.4 6 2.2 6.9a.6.6 0 0 1-.45 1H4.25a.6.6 0 0 1-.45-1C4.6 15.5 6 13.7 6 9.5z"></path><path d="M10 20.2a2.2 2.2 0 0 0 4 0"></path></svg><sc-if value="{{ ntHas }}" hint-placeholder-val="{{ true }}"><span class="badge">{{ ntCount }}</span></sc-if></button><a class="{{ setCls }}" href="AppSettings.dc.html" aria-label="설정" aria-current="{{ setCur }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a></header>
<main class="amain">
<label class="fl"><span class="lb">사례 아동 선택</span><select class="inp" value="{{ child }}" onChange="{{ setChild }}"><sc-for list="{{ kidOpts }}" as="k" hint-placeholder-count="10"><option>{{ k }}</option></sc-for></select></label>
<button type="button" class="pk pk1" onClick="{{ openPick }}"><span class="pk-i"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg></span>자료 올리기<span class="note" style="font-weight: 400;">파일 · 사진 보관함 · 사진 찍기</span></button>
<p class="sec-t">올린 자료 <span class="note">· 실패 {{ failN }}건</span></p>
<sc-for list="{{ items }}" as="x" hint-placeholder-count="3"><div class="{{ x.cls }}">
<div class="qi-top"><span class="chip">{{ x.kind }}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><b>{{ x.name }}</b><span class="note">{{ x.who }} · {{ x.size }} · {{ x.t }}</span></span><span class="{{ x.stCls }}">{{ x.st }}</span></div>
<sc-if value="{{ x.run }}" hint-placeholder-val="{{ false }}"><div class="prog"><span></span></div></sc-if>
<sc-if value="{{ x.fail }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; color: var(--red);">{{ x.err }}</span><div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;"><button type="button" class="btn btn-sm btn-red" onClick="{{ x.remove }}">지우기</button><button type="button" class="btn btn-sm btn-p" onClick="{{ x.retry }}">다시 올리기</button></div></sc-if>
</div></sc-for>
</main><nav class="tabs" aria-label="앱 메뉴"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><a class="{{ t.cls }}" href="{{ t.href }}" aria-label="{{ t.aria }}" aria-current="{{ t.cur }}"><span class="ti"><sc-if value="{{ t.isHome }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"></path><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"></path></svg><svg class="fi1" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.6 2.6 10.3c-.4.3-.6.8-.6 1.3V20a1.5 1.5 0 0 0 1.5 1.5h17A1.5 1.5 0 0 0 22 20v-8.4c0-.5-.2-1-.6-1.3zM9.8 21.5v-5.8h4.4v5.8z"></path></svg></sc-if><sc-if value="{{ t.isRec }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></sc-if><sc-if value="{{ t.isUp }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg><svg class="fi1" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2.5 14h5.2l1.6 2.4h5.4l1.6-2.4h5.2V19a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z"></path><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 13V3.5M7.5 8 12 3.5 16.5 8"></path></svg></sc-if><sc-if value="{{ t.isCal }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
