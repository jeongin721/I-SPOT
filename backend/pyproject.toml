# Lint 설정. 04_DEVELOPMENT.md 의 PR 최소 조건("Lint 성공")을 위해 사용한다.

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# 정확성 위주로만 검사한다.
# typing.Dict/List 스타일은 팀 B(ai/) 코드와 일관성을 유지하기 위해 강제하지 않는다.
select = [
    "E",   # pycodestyle
    "F",   # pyflakes (미사용 import / 미정의 이름)
    "B",   # flake8-bugbear (실수하기 쉬운 패턴)
]
ignore = [
    "E501",  # line-length 는 lint 대신 리뷰로 관리한다
    "B008",  # FastAPI 의 Depends()/File()/Query() 기본값 패턴
]

[tool.ruff.lint.per-file-ignores]
# 테스트는 app import 전에 환경변수를 설정해야 하므로 import 위치 규칙을 예외 처리한다.
"tests/conftest.py" = ["E402"]
