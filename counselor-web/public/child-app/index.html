<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>콩콩</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF8F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EFEAE2; --bg:#FBF8F3; --card:#FFFFFF; --ink:#2E2B28; --sub:#57514B; --mute:#6B645D;
  --line:#E2D9CC; --line2:#EEE7DC; --accent:#56708C; --accent-d:#3F566F; --sky:#E1E8F0; --sky2:#EEF2F6;
  --cream:#F6E9DA; --blue-soft:#788CA0;
  --lav:#EEE8F6; --lav-d:#6B5A8E; --danger:#B0452C; --danger-bg:#F8E6DF; --warn:#7A5A10; --warn-bg:#F7EDD6;
  --ok:#3F6B4A; --ok-bg:#E5EFE3; --fs:1;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0;font-size:22px;letter-spacing:-0.01em}
.top p{margin:2px 0 0;color:var(--sub);font-size:14px}
.btn-ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600;font-size:14px}
.stage{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:minmax(0,1fr)}}
.phone-col{display:flex;justify-content:center;position:sticky;top:16px}
@media (max-width:920px){.phone-col{position:static}}
.phone{position:relative;width:min(390px,100%);height:800px;background:var(--bg);border-radius:36px;border:10px solid #2E2B28;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(46,43,40,.18);font-size:calc(15px*var(--fs))}
.phone.large{--fs:1.15}
.screen{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 2px}
.bar h2{margin:0;font-size:1.35em;font-weight:700}
.brand{font-size:1.3em;font-weight:700;color:var(--ink);letter-spacing:-0.01em}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;padding:0}
.hide-btn{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:600;font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.hero{background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero small{color:var(--sub);font-size:.85em}
.hero b{font-size:1.25em}
.hero .btn-white{min-height:48px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:1em}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--mute);font-size:.86em}
.sub{color:var(--sub)}
.primary{min-height:52px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05em;width:100%}
.primary:disabled{background:#BAC5D0;cursor:default}
.outline{min-height:48px;border:1.5px solid var(--accent);border-radius:14px;background:#fff;color:var(--accent);font-weight:600;font-size:1em;width:100%}
.danger-btn{min-height:50px;border:none;border-radius:14px;background:var(--danger);color:#fff;font-weight:700;font-size:1em;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.textbtn{min-height:44px;border:none;background:transparent;color:var(--sub);font-weight:500;font-size:.95em;width:100%}
.lock{display:flex;gap:8px;align-items:flex-start;color:var(--mute);font-size:.86em}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.8em;font-weight:600}
.chip.sky{background:var(--sky);color:var(--accent)}
.chip.lav{background:var(--lav);color:var(--lav-d)}
.mini-card{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px;width:100%;text-align:left}
.char{display:block;object-fit:contain;height:auto;flex:0 0 auto}
.datebox{width:46px;height:46px;border-radius:12px;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 46px}
.datebox small{font-size:10px;font-weight:600;color:var(--accent)}
.datebox b{font-size:18px;line-height:1}
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding:6px 0 14px}
.tabbar button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:12px;color:var(--mute);font-weight:500}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.prog{flex:1 1 auto;display:grid;gap:6px}
.prog i{display:block;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qtitle{margin:0;font-size:1.45em;line-height:1.4;font-weight:700;text-wrap:balance}
.opt{min-height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;font-size:1.05em;text-align:left;width:100%}
.opt.plain{padding:0 16px}
.opt.hard{border-style:dashed;color:var(--sub);min-height:50px}
.opt.hard[aria-checked="true"]{border-style:solid;color:var(--ink)}
.opt[aria-checked="true"]{border:2px solid var(--accent);background:var(--sky2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:.92em}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--sky2);color:var(--accent);font-weight:600}
textarea,input[type=text]{width:100%;border:1px solid #C9BEAF;border-radius:12px;background:#fff;padding:12px 14px;font-size:1em;line-height:1.5;resize:none}
textarea:focus,input:focus,button:focus-visible{outline:3px solid #A9BBCD;outline-offset:1px}
label.lbl{font-size:.92em;font-weight:600}
.moodgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.moodgrid button{border-radius:14px;border:1px solid var(--line);background:#fff;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;font-size:.9em}
.moodgrid button[aria-checked="true"]{border:2px solid var(--accent);background:var(--sky2);font-weight:700}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.ticket{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--cream);border:2px solid var(--ink);font-weight:600;font-size:.95em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal span{font-size:12px;font-weight:600;color:var(--mute);padding:4px 0}
.cal i{font-style:normal;height:36px;display:flex;align-items:center;justify-content:center}
.cal i b{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.cal i b.next{background:var(--accent);color:#fff;font-weight:700}
.cal i b.later{background:var(--sky);font-weight:700}
.cal i b.today{outline:2px solid var(--accent);outline-offset:-2px}
.kcard{background:linear-gradient(#FFFFFF,#F7F2EA);border:1px solid var(--line);border-radius:20px;padding:12px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.kmachine{width:214px;height:auto;display:block;overflow:visible}
.kmachine .knob{transform-box:fill-box;transform-origin:center}
.kmachine.spin .knob{animation:knob .9s cubic-bezier(.5,0,.3,1)}
@keyframes knob{to{transform:rotate(360deg)}}
.kmachine.spin .caps{animation:jig .12s linear 8}
@keyframes jig{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}}
.kmachine .outcap{opacity:0}
.kmachine.spin .outcap{animation:outc .5s .95s ease-out forwards}
@keyframes outc{0%{opacity:0;transform:translateY(-12px)}60%{opacity:1;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
.krates{font-size:11.5px;color:var(--mute);text-align:center}
.kprog{width:100%;height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.kprog i{display:block;height:100%;background:linear-gradient(90deg,#9CB3CC,var(--accent))}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ktile{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;position:relative;min-width:0}
.ktile.t-r{border-color:#C9D8EE}
.ktile.t-s{border-color:#EBD39A;background:linear-gradient(#FFFBEE,#fff)}
.ktile.lock .kr{filter:brightness(0) opacity(.1)}
.ktile .qm{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:18px;color:#B9AFA2}
.news .news-ic{position:relative;display:inline-flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;background:var(--lav);color:var(--lav-d)}
.news .news-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--lav-d);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.news.hot{border-color:var(--danger)}
.news.hot .news-n{background:var(--danger);animation:newsp 1.2s ease-in-out infinite alternate}
@keyframes newsp{from{transform:scale(.9)}to{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){.news.hot .news-n{animation:none}}
.ktile .new{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:6px;padding:0 5px}
.ktile b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tierpill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px}
.kr{display:block;overflow:visible}
.reveal{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.reveal .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--gl) 0,transparent 68%);animation:glowp 1.4s ease-in-out infinite alternate}
@keyframes glowp{from{transform:scale(.92);opacity:.8}to{transform:scale(1.05);opacity:1}}
.reveal .rays{position:absolute;inset:-10px;background:repeating-conic-gradient(from 0deg,var(--gl) 0 6deg,transparent 6deg 24deg);border-radius:50%;opacity:.5;animation:rot 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes rot{to{transform:rotate(360deg)}}
.reveal .kin{position:relative;animation:popin .5s .45s both cubic-bezier(.2,1.5,.4,1)}
.reveal .kin .kr{animation:swing 2.6s 1s ease-in-out infinite;transform-origin:50% 6%}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.reveal .capt,.reveal .capb{position:absolute;left:50%;top:50%;width:96px;height:48px;margin-left:-48px}
.reveal .capt{margin-top:-48px;animation:capt .55s .2s ease-in forwards}
.reveal .capb{margin-top:0;animation:capb .55s .2s ease-in forwards}
@keyframes capt{to{transform:translate(-46px,-70px) rotate(-38deg);opacity:0}}
@keyframes capb{to{transform:translate(40px,60px) rotate(24deg);opacity:0}}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.keys div{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:4px 2px 8px;display:flex;flex-direction:column;align-items:center;font-size:12px}
.keys .q{width:52px;height:48px;border-radius:14px;background:#F3EEE6;border:2px dashed #CDBFAD;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute);margin-top:4px}
.machine{width:170px;height:190px}
.machine.spin{animation:wob .18s linear 6}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.helpbtn{min-height:68px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left;width:100%}
.helpbtn.red{background:var(--danger);border-color:var(--danger);color:#fff}
.helpbtn b{display:block;font-size:1.05em}
.helpbtn small{display:block;font-size:.82em;opacity:.85}
.guide{display:flex;flex-direction:column;gap:8px}
.guide details{background:var(--card);border:1px solid var(--line);border-radius:14px}
.guide summary{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;font-weight:600;cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:'+';font-size:1.3em;font-weight:400;color:var(--mute)}
.guide details[open] summary::after{content:'−'}
.guide .dbody{padding:0 14px 14px;font-size:.93em;color:var(--sub)}
.guide ol,.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.contacts{display:flex;flex-direction:column;gap:0}
.contacts div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.contacts div:first-child{border-top:none}
.contacts b{font-size:1.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.yellow{background:#F3DFA2;color:var(--ink);padding:0 4px;border-radius:4px;font-weight:600}
.setrow{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:none}
.seg{display:flex;gap:6px}
.seg button{min-width:52px;min-height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.88em}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--sky2)}
.sheet-wrap{position:absolute;inset:0;background:rgba(20,26,31,.42);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px;max-height:85%;overflow-y:auto}
.sheet h3{margin:0;font-size:1.2em}
.bignum{font-size:34px;font-weight:700;letter-spacing:.04em;text-align:center;font-variant-numeric:tabular-nums}
.count{font-size:56px;font-weight:700;color:var(--danger);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.banner{position:absolute;left:10px;right:10px;top:10px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13px}
.banner .app{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:0 0 34px}
.banner.nprev{position:static;box-shadow:none;z-index:auto}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#2E2B28;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;z-index:40;max-width:86%;text-align:center}
/* garden game v2 (숨기기 화면) */
.gm{flex:1 1 auto;display:flex;flex-direction:column;position:relative;color:#26302A;font-family:'IBM Plex Sans KR',system-ui,sans-serif;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.10) 0 2px,transparent 3px) 0 0/28px 28px,radial-gradient(circle at 70% 80%,rgba(40,70,30,.10) 0 2px,transparent 3px) 0 0/34px 34px,linear-gradient(#A8BF8A,#93AD74)}
.gm-top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.gm-panel{background:rgba(252,251,246,.92);border:1px solid rgba(38,48,42,.12);box-shadow:0 2px 6px rgba(38,48,42,.10);border-radius:12px}
.gm-back{height:38px;display:inline-flex;align-items:center;gap:2px;padding:0 12px 0 6px;font-weight:600;font-size:13.5px;border-radius:19px}
.gm-lv{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 10px}
.gm-lv b{font-size:12px;background:#3E6B4A;color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
.gm-lv .xp{flex:1 1 auto;height:7px;border-radius:4px;background:#E4E7DC;overflow:hidden}
.gm-lv .xp i{display:block;height:100%;background:linear-gradient(90deg,#7FB069,#4F8A5B)}
.gm-coin{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.gm-orders{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.gm-order{padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gm-order .h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#5E6B60;font-weight:600}
.gm-order .its{display:flex;gap:6px;flex-wrap:wrap}
.gm-order .it{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.gm-order .it.ok{color:#3E6B4A}
.gm-order button{min-height:30px;border-radius:8px;border:none;background:#3E6B4A;color:#fff;font-weight:600;font-size:12.5px}
.gm-order button:disabled{background:#C9CFC3;color:#6D756C;cursor:default}
.gm-field{margin:10px 12px 0;padding:10px;border-radius:16px;background:linear-gradient(#8C6A4B,#7A5B3F);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 3px 8px rgba(38,48,42,.25);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bed{aspect-ratio:1/1;border-radius:10px;border:none;padding:0;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/14px 14px,linear-gradient(#6E5038,#5B412D);box-shadow:inset 0 3px 6px rgba(0,0,0,.30)}
.bed.wet{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.05) 0 2px,transparent 3px) 0 0/14px 14px,linear-gradient(#4E3926,#3F2E1F)}
.bed.locked{background:repeating-linear-gradient(135deg,#8E7A62 0 8px,#857059 8px 16px);box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.bed > svg{position:absolute;inset:0;width:100%;height:100%}
.bed .badge{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bed .badge.water{background:#E8F1F8;animation:bob 1.2s ease-in-out infinite}
.bed .badge.ready{background:#FCEFC4}
.bed .pill{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);background:rgba(20,24,20,.55);color:#fff;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bed .bar3{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px;background:rgba(0,0,0,.3);overflow:hidden}
.bed .bar3 i{display:block;height:100%;background:#9FD07F}
.bed .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#FFF8EC;font-size:11.5px;font-weight:600}
.bed.ready svg{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.gm-dock{margin:auto 12px 12px;display:flex;gap:8px;align-items:stretch;padding:8px}
.gm-inv{flex:1 1 auto;min-width:0;display:flex;gap:6px;align-items:center;overflow:hidden}
.gm-inv span{display:inline-flex;align-items:center;gap:1px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.gm-btn{min-height:40px;border-radius:10px;border:1px solid rgba(38,48,42,.15);background:#fff;font-weight:600;font-size:12.5px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.gm-btn.pri{background:#3E6B4A;border-color:#3E6B4A;color:#fff}
.gm-float{position:absolute;pointer-events:none;font-weight:700;font-size:14px;color:#FFF6D6;text-shadow:0 1px 2px rgba(0,0,0,.5);animation:fl .9s ease-out forwards;z-index:5}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
.gm-toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(28,36,30,.85);color:#fff;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;z-index:6;white-space:nowrap}
.gm-sheet-wrap{position:absolute;inset:0;background:rgba(20,26,20,.35);display:flex;align-items:flex-end;z-index:8}
.gm-sheet{width:100%;background:#FBFAF5;border-radius:18px 18px 0 0;padding:14px 14px 18px;display:flex;flex-direction:column;gap:8px;max-height:80%;overflow-y:auto}
.gm-sheet h3{margin:0 0 2px;font-size:15px}
.gm-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid rgba(38,48,42,.12);background:#fff;width:100%;text-align:left;font-size:13px}
.gm-row:disabled{opacity:.55;cursor:default}
.gm-row .ic{width:44px;height:44px;border-radius:10px;background:#EEF1E6;flex:0 0 44px;position:relative;overflow:hidden}
.gm-row .ic svg{position:absolute;inset:0;width:100%;height:100%}
.gm-row small{display:block;color:#5E6B60;font-size:11.5px}
.gm-row .price{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* panel */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.phead h2{margin:0;font-size:17px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:#EEF0F2;color:#3D4852}
.tag.red{background:var(--danger-bg);color:var(--danger)}
.tag.amber{background:var(--warn-bg);color:var(--warn)}
.tag.green{background:var(--ok-bg);color:var(--ok)}
.tag.blue{background:var(--sky2);color:var(--accent)}
.urgent{background:var(--danger-bg);border:1.5px solid var(--danger);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.urgent b{color:var(--danger)}
.feed{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto}
.fitem{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fitem .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.qa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px;align-items:start}
.qa .q{color:var(--sub)}
.qa .a{font-weight:600;text-align:right}
.bank{display:flex;flex-direction:column;gap:6px}
.bank label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.bank label:has(input:checked){border-color:var(--accent);background:var(--sky2)}
.bank input{margin-top:3px;width:16px;height:16px;flex:0 0 16px}
.silent{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px}
.silent input[type=range]{flex:1 1 160px}
.pbtn{min-height:40px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;padding:0 14px;font-size:14px}
.pbtn:disabled{background:#BAC5D0;cursor:default}
.pbtn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:500px){.wrap{padding:0;max-width:none}.phone-col{position:static}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
</style>

<div class="wrap">
  <section class="phone-col" aria-label="콩콩">
    <div class="phone" id="phone">
      <div class="screen" id="screen"></div>
      <nav class="tabbar" id="tabbar" aria-label="메인 메뉴"></nav>
      <div id="layer"></div>
    </div>
  </section>
</div>

/* ---------- 숨기기 ---------- */
function hide(){ S.hidden = true; S.sheet = null; S.banner = null; S.gSheet = null; S.gToast = ''; render(); document.getElementById('screen').scrollTop = 0; gStart(); }
function unhide(){ S.hidden = false; S.gSheet = null; gStop(); render(); toast('돌아왔어요'); }

/* ---------- 동작 ---------- */
function toast(t){ S.toast = t; renderLayer(); later(() => { S.toast = null; renderLayer(); }, 2200); }
function notify(t){ S.banner = t; renderLayer(); later(() => { S.banner = null; renderLayer(); }, 3200); }
function push(item){ item.t = now(); S.feed.unshift(item); S.silent = 0; }
function go(screen){ S.screen = screen; S.sheet = null; render(); document.getElementById('screen').scrollTop = 0; }

async function api(path, options){
  const headers = {'Content-Type':'application/json'}, token = load(STORE.token, null);
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, {...options, headers});
  if (res.status === 401 && token) { forget(STORE.token); clearTimers(); S = fresh(); render(); throw new Error('unlinked'); }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) { const e = new Error('api'); e.status = res.status; e.message2 = body && body.error && body.error.message; throw e; }
  return body && body.data;
}
// 설정의 '연결 해지하기'. 서버에서 연결을 끊은 뒤 이 휴대폰에 남은 콩콩 기록을 모두 지우고 처음(코드 입력) 화면으로 간다.
async function unlinkDevice(){
  if (S.sending) return;
  S.sending = true; renderLayer();
  try {
    await api('/unlink', {method:'POST'});
  } catch (e) {
    if (e.message !== 'unlinked') { S.sending = false; renderLayer(); toast('해지하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요'); return; }
  }
  Object.values(STORE).forEach(forget);
  clearTimers(); S = fresh(); render();
  toast('연결을 해지했어요');
}
function applyHome(d){
  S.next = d.next_consult;
  S.alert = d.alert || null;
  const p = d.pending, wasId = S.setId;
  if (p) { p.questions.forEach(q => { BK[q.id] = {...q, opts:q.options, short:q.text}; }); S.qset = p.questions.map(q => q.id); S.setId = p.id; S.qPending = true; }
  else { S.qset = []; S.setId = null; S.qPending = false; }
  return p && p.id !== wasId;
}
async function refreshHome(alertNew){
  if (!load(STORE.token, null) || S.hidden || S.screen === 'q' || S.sheet) return;
  try {
    const isNew = applyHome(await api('/home'));
    if (S.hidden || S.screen === 'q' || S.sheet) return;
    if (['home','cal'].includes(S.screen)) renderScreen();
    if (isNew && alertNew) notify(NOTI[S.noti]);
  } catch (e) {}
}
async function linkDevice(code){
  if (!code.trim()) { toast('연결 코드를 입력하세요'); return; }
  if (S.sending) return;
  S.sending = true;
  try {
    const d = await api('/link', {method:'POST', body:JSON.stringify({code})});
    save(STORE.token, d.device_token); go('onboard');
  } catch (e) { toast(e.status === 400 ? '연결 코드를 다시 확인해 주세요' : (e.status === 429 ? '잠시 후 다시 시도해 주세요' : '연결하지 못했어요. 인터넷을 확인해 주세요')); }

async function submitQ(){
  if (S.sending) return;
  S.sending = true;
  const answers = S.qset.map(id => {
    const a = S.ans[id] || {skip:true};
    if (a.skip) return {question_id:id, skipped:true};
    if (BK[id].type === 'text') return {question_id:id, text:(a.text || '').trim() || null, chip:a.chip || null};
    return {question_id:id, choice_index:a.i};
  });
  try {
    const d = await api(`/question-sets/${S.setId}/answers`, {method:'POST', body:JSON.stringify({answers})});
    S.tickets += d.ticket_awarded; save(STORE.tickets, S.tickets);
    S.qPending = false; S.setId = null; S.qset = [];
    go('doneQ');
  } catch (e) {
    if (e.message === 'unlinked') { S.sending = false; return; }
    if (e.status === 409 || e.status === 404) { S.ans = {}; go('home'); S.sending = false; await refreshHome(false); toast('질문이 바뀌었어요. 다시 확인해 주세요'); return; }
    toast('보내지 못했어요. 인터넷을 확인하고 다시 눌러 주세요');
  }
  S.sending = false;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if ((act === 'sheetBg' || act === 'gSheetBg') && e.target !== el) return;
  switch (act) {
    
    case 'link': { const v = (document.getElementById('code') || {}).value || ''; S.code = v; linkDevice(v); break; }
    case 'startApp': go('home'); refreshHome(false); break;
    case 'hide': hide(); break;
    case 'tab': S.tab = el.dataset.to; go(el.dataset.to); if (el.dataset.to === 'home' || el.dataset.to === 'cal') refreshHome(false); break;
    case 'go': if (el.dataset.to === 'mood') { S.moodPick = null; S.moodWhy = ''; } if (el.dataset.to === 'note') { S.note = ''; S.noteChip = null; } go(el.dataset.to); break;
    case 'startQ': S.qi = 0; S.ans = {}; go('q'); break;
    case 'ansHard': { const id = S.qset[S.qi]; S.ans[id] = {skip:true}; renderScreen(); break; }
    case 'ans': { const id = S.qset[S.qi]; S.ans[id] = {i:+el.dataset.i}; renderScreen(); break; }
    case 'qchip': { const id = S.qset[S.qi]; const cur = S.ans[id] || {}; const txt = (document.getElementById('qtext') || {}).value || ''; S.ans[id] = {text:txt, chip: cur.chip === el.dataset.c ? null : el.dataset.c}; renderScreen(); break; }
    case 'qNext': case 'qSkip': {
      const id = S.qset[S.qi], q = BK[id];
      if (act === 'qSkip') S.ans[id] = {skip:true};
      else if (q.type === 'text') { const cur = S.ans[id] || {}; S.ans[id] = {text:(document.getElementById('qtext') || {}).value || '', chip:cur.chip || null}; }
      if (S.qi < S.qset.length - 1) { S.qi++; renderScreen(); document.getElementById('screen').scrollTop = 0; } else submitQ();
      break; }
    case 'qClose': S.sheet = {kind:'qClose'}; renderLayer(); break;
    case 'qCloseYes': S.ans = {}; go('home'); break;
    case 'mood': S.moodWhy = (document.getElementById('why') || {}).value || ''; S.moodPick = el.dataset.m; renderScreen(); break;
    case 'sendMood': { const why = ((document.getElementById('why') || {}).value || '').trim(); push({kind:'mood', m:S.moodPick, why}); go('doneMood'); break; }
    case 'noteChip': S.note = (document.getElementById('note') || {}).value || ''; S.noteChip = S.noteChip === el.dataset.c ? null : el.dataset.c; renderScreen(); break;
    case 'sendNote': { const t = ((document.getElementById('note') || {}).value || '').trim(); if (!t && !S.noteChip) { toast('내용을 입력하거나 아래에서 하나 골라 주세요'); break; } push({kind:'note', text:t, chip:S.noteChip}); go('doneNote'); break; }
    case 'calHard': S.sheet = {kind:'calHard', pick:null}; renderLayer(); break;
    case 'calReason': S.sheet.pick = el.dataset.c; renderLayer(); if (el.dataset.c === '기타') { const f = document.getElementById('calEtc'); if (f) f.focus(); } break;
    case 'calSend': { const etc = (S.sheet.etc || '').trim(); if (S.sheet.pick === '기타' && !etc) { toast('이유를 짧게 입력해 주세요'); break; }
      push({kind:'cal', text:'11월 3일 상담에 가기 어려움', reason: S.sheet.pick === '기타' ? '기타 · ' + etc : S.sheet.pick}); } S.sheet = null; renderLayer(); toast('선생님께 알렸어요. 다른 날짜를 함께 정해요'); break;
    case 'gachaAgain': S.sheet = null; renderLayer();
    // falls through
    case 'gacha': {
      if (S.tickets < 1 || S.spin) break;
      S.tickets -= 1; save(STORE.tickets, S.tickets); S.spin = true; renderScreen();
      later(() => {
        S.spin = false;
        const notOwned = KR.filter(k => !S.keys.includes(k.id));
        let k, dup = false;
        if (notOwned.length) {
          const tiers = ['n', 'r', 's'].filter(t => notOwned.some(x => x.t === t));
          const tot = tiers.reduce((a2, t) => a2 + TIER[t].p, 0); let r = Math.random() * tot, tier = tiers[tiers.length - 1];
          for (const t of tiers) { if (r < TIER[t].p) { tier = t; break; } r -= TIER[t].p; }
          const pool = notOwned.filter(x => x.t === tier); k = pool[Math.floor(Math.random() * pool.length)];
        } else { k = KR[Math.floor(Math.random() * KR.length)]; dup = true; S.tickets += 1; }
        if (!dup) { S.keys.push(k.id); save(STORE.keys, S.keys); }
        S.newKey = k.id; S.sheet = {kind:'gotKey', m:k.id, dup}; renderScreen();
      }, 1550);
      break; }
    case 'urgent': S.sheet = {kind:'urgent'}; renderLayer(); break;
    case 'alertNews': S.sheet = {kind:'alertNews'}; renderLayer(); break;
    case 'call': S.sheet = {kind:'call', n:el.dataset.n}; renderLayer(); break;
    case 'callGo': { const n = S.sheet.n; S.sheet = null; renderLayer(); location.href = 'tel:' + n; break; }
    case 'alertStart': startAlert(); break;
    case 'alertRetry': sendAlert(); break;
    case 'alertCancel': clearInterval(S._iv); S.sheet = null; renderLayer(); toast('취소했어요. 보내지 않았어요'); break;
    case 'sheetClose': S.sheet = null; renderScreen(); break;
    case 'sheetBg': S.sheet = null; renderLayer(); break;
    case 'unlinkAsk': S.sheet = {kind:'unlink'}; renderLayer(); break;
    case 'unlinkGo': unlinkDevice(); break;
    case 'font': S.large = el.dataset.v === '1'; renderScreen(); break;
    case 'noti': S.noti = +el.dataset.v; renderScreen(); break;
    case 'unhide': unhide(); break;
    case 'gBed': case 'gPlant': case 'gUnlock': case 'gWaterAll': case 'gHarvestAll': case 'gOrder': case 'gBarn': case 'gSellAll': case 'gSheetClose': gAct(act, el); break;
    case 'gSheetBg': if (e.target === el) gAct(act, el); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'code') S.code = t.value;
  if (t.id === 'calEtc' && S.sheet) S.sheet.etc = t.value;
});

async function sendAlert(){
  S.sheet = {kind:'alertSending'}; renderLayer();
  try {
    await api('/alerts', {method:'POST', body:'{}'});
    // 다음 /home 전까지도 홈에 '확인 전'이 보이게. 이미 확인 전 알림이 있으면 처음 보낸 시각을 그대로 둔다.
    if (!S.alert || S.alert.acknowledged) S.alert = {sent_at:new Date().toISOString(), acknowledged:false, overdue:false};
    S.sheet = {kind:'alerted'};
  } catch (e) {
    if (e.message === 'unlinked') return;
    S.sheet = {kind:'alertFailed'};
  }
  renderLayer();
}
function startAlert(){
  S.count = 5; S.sheet = {kind:'counting'}; renderLayer();
  clearInterval(S._iv);
  S._iv = setInterval(() => {
    S.count -= 1;
    if (S.count <= 0) { clearInterval(S._iv); sendAlert(); }
    else renderLayer();
  }, 1000);
}

function render(){ renderScreen(); }
render();
refreshHome(false);
setInterval(() => { if (!document.hidden) refreshHome(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshHome(true); });
</script>
