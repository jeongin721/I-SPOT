name: STT module

# stt/ 와 루트 tests/ 는 Backend CI 범위 밖이라(backend-ci.yml), 구간별 음성 참고 표시 모듈(stt/voice_marks.py)의
# 시험만 따로 돈다. 바뀔 때만 돌고, 의존성은 Backend 이미지와 같은 backend/requirements-stt.txt 를 쓴다
# (librosa · numba · soundfile 과 STT SDK). 첫 실행은 numba 컴파일 때문에 몇 초 더 걸린다.
on:
  push:
    paths:
      - "stt/**"
      - "tests/test_voice_marks.py"
      - "backend/requirements-stt.txt"
      - ".github/workflows/stt-ci.yml"
  pull_request:
    paths:
      - "stt/**"
      - "tests/test_voice_marks.py"
      - "backend/requirements-stt.txt"
      - ".github/workflows/stt-ci.yml"

jobs:
  voice-marks:
    name: voice_marks pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-stt.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-stt.txt pytest

      - name: Run voice_marks tests
        # 루트에서 돌려야 `from stt import voice_marks` 가 된다. 캐시 파일을 저장소에 남기지 않는다.
        run: python -B -m pytest tests/test_voice_marks.py -q -p no:cacheprovider
